# Render Blueprint for Job Scheduler Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: job-scheduler-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false  # Set manually in Render dashboard
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: WEBHOOK_URL
        sync: false
